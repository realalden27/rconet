name: Adversarial Fuzz & Panic-Hunt

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panic-hunt:
    name: Hostile Input & Property Suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Run extended property suites
        env:
          PROPTEST_CASES: "10000"
        run: cargo test -p rconet-types -p rconet-proto --all-features

      - name: Run adversarial panic-hunt suites
        run: cargo run -p xtask -- fuzz
