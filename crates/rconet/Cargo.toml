[package]
name = "rconet"
description = "Asynchronous, cancellation-safe RCON client ecosystem for Rust"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rconet"
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["tokio-tcp", "base64"]
tokio-tcp = ["rconet-transport/tokio-tcp", "tokio/net"]
base64 = ["rconet-proto/base64"]
webrcon = ["rconet-proto/webrcon"]
pool = []
fleet = []
test-util = ["rconet-transport/test-util"]

[dependencies]
rconet-proto.workspace = true
rconet-transport.workspace = true
rconet-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
rconet-transport = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
