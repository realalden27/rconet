[package]
name = "rconet"
description = "Asynchronous, cancellation-safe RCON client ecosystem for Rust"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["tokio-tcp", "base64"]
tokio-tcp = ["rconet-transport/tokio-tcp", "tokio/net"]
base64 = ["rconet-proto/base64"]
webrcon = ["rconet-proto/webrcon"]
pool = []
fleet = []

[dependencies]
rconet-proto = { workspace = true, default-features = false }
rconet-transport = { workspace = true, default-features = false }
rconet-types.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
bytes.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
